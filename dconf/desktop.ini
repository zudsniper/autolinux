# GNOME desktop settings captured from the reference machine (tools/profile.sh).
# Loaded with: dconf load / < dconf/desktop.ini
#
# Intentionally NOT captured: gtk-theme (the reference box still carries
# Greybird from Xubuntu), cursor-theme and font-name (also Xfce leftovers).

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
accent-color='pink'
icon-theme='Yaru-dark'
cursor-blink=true
cursor-blink-time=1200

[org/gnome/desktop/wm/preferences]
button-layout='icon,menu:minimize,maximize,close'
action-middle-click-titlebar='lower'
# Super+drag moves windows and double-click maximizes: both GNOME defaults,
# so they are not set here (dconf only stores non-default values).

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=30
dock-fixed=false

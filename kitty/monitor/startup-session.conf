# Custom kitty session for system monitoring
# This session creates a vertical split with nvtop on right, btop on left

# Set font size to 10 (decreased by 1 from default 11)
#font_size 10

# Create new tab with layout
new_tab System Monitor
layout splits:split_axis=vertical

# Launch btop in the first (left) window
launch --title=btop btop

# Launch nvtop in the second (right) window  
launch --location=vsplit --title=nvtop nvtop

hide_window_decorations titlebar-only
window_border_width 0
draw_minimal_borders yes

enabled_layouts splits:split_axis=horizontal

map f5 launch --location=hsplit

map f6 launch --location=vsplit

map f7 layout_action rotate


map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

map ctrl+alt+t set_window_title
map ctrl+shift+alt+t set_tab_title

# OS window sizing: fixed, sane default instead of remembering the last size
remember_window_size no
initial_window_width 1500
initial_window_height 900

# ── Custom titlebar (VSCode-style, replaces the OS titlebar) ─────────────
# The OS titlebar stays hidden (hide_window_decorations titlebar-only above,
# which keeps the resize shadows). Instead, kitty GPU-renders a slim one-row
# title strip on top of every split, lone window included (min_windows 1).
# Move the OS window with Super+drag (GNOME default).
window_title_bar             top
window_title_bar_min_windows 1
window_title_bar_align       center
window_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"
active_window_title_template "{fmt.fg.red}{bell_symbol}{fmt.fg._3794ff}● {fmt.fg.window}{progress_percent}{fmt.bold}{title}{fmt.nobold}"
window_title_bar_active_foreground   #cccccc
window_title_bar_active_background   #1f1f1f
window_title_bar_inactive_foreground #6e6e6e
window_title_bar_inactive_background #141414

# Tabs sit above the title strips, only once a second tab exists
tab_bar_edge            top
tab_bar_min_tabs        2
tab_bar_style           separator
tab_separator           ""
tab_bar_margin_height   0 0
tab_title_template      "  {index}  {title}  "
tab_bar_background      #181818
active_tab_foreground   #ffffff
active_tab_background   #1f1f1f
active_tab_font_style   bold
inactive_tab_foreground #8b8b8b
inactive_tab_background #181818
inactive_tab_font_style normal
